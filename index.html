<title>Moramor — Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C8A24E;--bg:#06091F;--card:#0c1235;--card-h:#111a45;--txt:#E8E6E0;--txt2:#8E8C86;--wh:#FFF;--bdr:#111835}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Cormorant Garamond',Georgia,serif;display:flex;flex-direction:column}
.sans{font-family:'Outfit',sans-serif}
.header{padding:10px 20px;border-bottom:1px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-left{display:flex;align-items:center;gap:16px}
.brand{font-size:8px;font-weight:600;letter-spacing:3px;color:var(--gold)}
h1{font-size:20px;font-weight:300;color:var(--wh);line-height:1}
.h-center{display:flex;gap:5px;flex-wrap:wrap}
.mb{cursor:pointer;padding:6px 14px;border:1px solid var(--bdr);background:transparent;color:var(--txt2);border-radius:5px;font-family:'Outfit',sans-serif;font-size:11px;transition:all .2s}
.mb:hover{border-color:var(--gold);color:var(--gold)}
.mb.a{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.mb.gl{border-color:#5B3D8F55;color:#9B8AFF}.mb.gl:hover{border-color:#9B8AFF}.mb.gl.a{background:#9B8AFF;color:var(--bg);border-color:#9B8AFF}
.h-right{display:flex;align-items:center;gap:6px}
.fb{cursor:pointer;padding:3px 9px;border:1px solid #1a2040;background:transparent;color:var(--txt2);border-radius:14px;font-family:'Outfit',sans-serif;font-size:10px;transition:all .2s}
.fb:hover{border-color:rgba(200,162,78,.27)}.fb.a{background:rgba(200,162,78,.13);color:var(--gold);border-color:rgba(200,162,78,.27)}
.phase-tag{font-size:10px;color:var(--gold);font-weight:500;margin-left:8px}
.main-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.cal-wrap{flex:1;display:flex;flex-direction:column;padding:6px;overflow:hidden}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dh{text-align:center;font-size:10px;font-weight:500;color:var(--txt2);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.cell{border:1px solid var(--bdr);border-radius:6px;background:var(--card);transition:all .2s;padding:6px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cell.empty{background:transparent;border-color:transparent}
.cell.hp{cursor:pointer}.cell.hp:hover{border-color:rgba(200,162,78,.4);background:var(--card-h);transform:scale(1.01)}
.cell-day{font-size:12px;font-weight:500;color:rgba(142,140,134,.3);margin-bottom:auto}.cell.hp .cell-day{color:var(--wh)}
.pills{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.pill{padding:4px 7px;border-radius:4px;font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:opacity .2s}.pill:hover{opacity:.8}
.pill .sb{display:inline-block;background:#C8A24E;color:#06091F;font-size:8px;font-weight:700;padding:0 4px;border-radius:2px;margin-left:4px;vertical-align:middle}
/* Glossary */
.glos-wrap{flex:1;overflow-y:auto;padding:24px 32px}
.glos-wrap::-webkit-scrollbar{width:5px}.glos-wrap::-webkit-scrollbar-thumb{background:rgba(200,162,78,.2);border-radius:4px}
.gs{margin-bottom:32px}.gs-t{font-size:11px;font-weight:600;letter-spacing:3px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gc{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:16px;transition:all .2s;border-left:4px solid transparent}
.gc:hover{background:var(--card-h)}.gc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gc-i{font-size:20px}.gc-t{font-size:14px;font-weight:600;color:var(--wh)}.gc-c{font-size:10px;color:var(--txt2);background:#111835;padding:2px 8px;border-radius:10px;margin-left:auto}
.gc-d{font-size:12px;line-height:1.6;color:var(--txt2)}.gc-m{font-size:11px;font-weight:500;margin-top:8px;padding:6px 10px;border-radius:4px;background:#06091F}
.gc-s{font-size:11px;color:var(--txt2);margin-top:8px;line-height:1.5}.gc-s span{color:var(--txt);font-weight:500}
/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.overlay.show{display:flex}
.modal{background:#0a0f2e;border:1px solid rgba(200,162,78,.2);border-radius:12px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;position:relative}
.modal::-webkit-scrollbar{width:4px}.modal::-webkit-scrollbar-thumb{background:rgba(200,162,78,.2);border-radius:4px}
.mt{padding:24px 24px 0}.mc{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--txt2);cursor:pointer;font-size:22px;line-height:1}
.mp{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-bottom:3px}
.md2{font-size:12px;color:var(--txt2);margin-bottom:14px}
.mtl{font-size:20px;font-weight:400;color:var(--wh);margin-bottom:10px;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-family:'Outfit',sans-serif;font-size:10px;font-weight:500}
.mbdy{padding:0 24px 20px}
.sbox{background:linear-gradient(135deg,#1a1a0d,#1a1408);border:1px solid #C8A24E44;border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px}
.si{font-size:18px;flex-shrink:0}.sc{flex:1}.stl{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-bottom:4px}.sds{font-size:12px;color:var(--txt);line-height:1.5}
.cbox{background:#06091F;border-radius:8px;padding:16px;border-left:3px solid var(--gold);margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cl{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--gold)}
.cpb{cursor:pointer;padding:8px 20px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:6px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;transition:all .2s;letter-spacing:1px}
.cpb:hover{background:var(--gold);color:var(--bg)}.cpb.ok{background:#2D8B55;border-color:#2D8B55;color:#fff}
.ct{font-size:12.5px;line-height:1.7;color:#d4d2cc;white-space:pre-wrap;word-break:break-word;font-family:'Outfit',sans-serif}
.ir{display:flex;gap:8px}.ic{flex:1;background:#06091F;border-radius:6px;padding:10px}
.il{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--txt2);margin-bottom:3px}
.iv{font-size:11px;color:var(--wh)}.idt{font-size:10px;color:var(--txt2);line-height:1.5}
</style>
</head>

{d:"2026-04-01",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"Blanco \u2014 Hero on navy",s:0,ig:"Blanco.\n\nEl agave antes de que el tiempo lo toque.\nFresco. Cristalino. Sin concesiones.\n\nAromas de agave cocido, hierbas frescas, c\u00edtricos y fruta.\n\n750 ml \u00b7 40% Alc. Vol. \u00b7 100% Agave\nCer\u00e1mica talavera artesanal."+HT},
{d:"2026-04-02",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"Reposado \u2014 Hero on navy",s:0,ig:"Reposado.\n\nEl tiempo le dio lo que el agave no pod\u00eda hacer solo.\n\nCaramelo especiado. Frutas tropicales. Vainilla.\nDorado p\u00e1lido con destellos brillantes.\n\nLa paciencia tiene sabor.\n\n750 ml \u00b7 40% Alc. Vol. \u00b7 100% Agave\nCer\u00e1mica talavera artesanal."+HT},
{d:"2026-04-03",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"A\u00f1ejo \u2014 Hero on navy",s:0,ig:"A\u00f1ejo.\n\nDe 1 a 3 a\u00f1os en barrica de roble.\nLo que entra joven sale con car\u00e1cter.\n\nAgave cocido. Almendras tostadas. Clavo. Vainilla.\n\u00c1mbar con matices cobrizos.\n\nHay cosas que solo el tiempo puede crear.\n\n750 ml \u00b7 40% Alc. Vol. \u00b7 100% Agave\nCer\u00e1mica talavera artesanal."+HT},
{d:"2026-04-04",pl:"Detalles & Craft",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Close-up talavera detail",s:0,ig:"El detalle no es decoraci\u00f3n.\nEs declaraci\u00f3n.\n\nCada relieve. Cada trazo. Cada imperfecci\u00f3n calculada.\n\nCer\u00e1mica talavera artesanal \u2014 una tradici\u00f3n que lleva siglos perfeccion\u00e1ndose.\n\nCuando la sostienes, lo sientes."+HT},
{d:"2026-04-05",pl:"Detalles & Craft",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Macro ceramic texture",s:0,ig:"Cer\u00e1mica. No vidrio.\n\nCada botella pesa m\u00e1s. Cuesta m\u00e1s. Tarda m\u00e1s en producirse.\n\nPero cuando llega a la mesa, nadie pregunta de qu\u00e9 marca es.\n\nPreguntan qu\u00e9 es eso."+HT},
{d:"2026-04-06",pl:"Branding & Dise\u00f1o",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Quote card \u2014 \"El dorado confirma\"",s:1,st:"quote",ig:"El dorado no susurra.\nConfirma.\n\nLo que se siente diferente, se recuerda diferente."+HT},
{d:"2026-04-07",pl:"Lifestyle Premium",f:"Photo Post",a:0,as:"lifestyle",ph:"Foundation Grid",tp:"Bottle on elegant table",s:0,ig:"Algunas noches piden algo diferente.\n\nNo m\u00e1s fuerte. No m\u00e1s caro.\nDiferente.\n\nMoramor no es para todas las noches.\nEs para las que importan."+HT},
{d:"2026-04-08",pl:"Lifestyle Premium",f:"Photo Post",a:0,as:"lifestyle",ph:"Foundation Grid",tp:"Pour moment, warm light",s:0,ig:"Cuando la cer\u00e1mica toca la mesa, algo cambia.\n\nLa conversaci\u00f3n se pausa un segundo.\nLas miradas se dirigen al centro.\n\nNo es el tequila.\nEs el momento."+HT},
{d:"2026-04-09",pl:"Cultura & Origen",f:"Photo Post",a:0,as:"cultura",ph:"Foundation Grid",tp:"Bottle with artisanal texture",s:0,ig:"Jalisco, M\u00e9xico.\n\nDonde el agave azul crece bajo el mismo sol que ha dado forma a generaciones de maestros tequileros.\n\nRa\u00edz mexicana. Lenguaje contempor\u00e1neo.\nSin folclor literal. Sin pedir permiso."+HT},
{d:"2026-04-10",pl:"Producto Cinem\u00e1tico",f:"Reel",a:4,as:"cinematico",ph:"Content Push",tp:"360\u00b0 reveal \u2014 Ceramic presence",s:0,ig:"750 ml.\nCer\u00e1mica talavera.\nHecho para quedarse en la mesa.\nY en la memoria."+HT},
{d:"2026-04-11",pl:"Branding & Dise\u00f1o",f:"Threads",a:7,as:null,ph:"Content Push",tp:"7C \u2014 The Price Apology",s:0,ig:"Las marcas mexicanas de tequila premium tienen un patr\u00f3n: se disculpan por su precio.\n\nDescuentan para cerrar. Lideran con \"valor\" en vez de valor.\n\nEl precio no es un n\u00famero. Es una declaraci\u00f3n.\n\n\u00bfO no?"},
{d:"2026-04-12",pl:"Lifestyle Premium",f:"Photo Post",a:2,as:"lifestyle",ph:"Content Push",tp:"2A \u2014 First impression is digital",s:0,ig:"La primera impresi\u00f3n ya no es en la mesa.\nEs en el feed.\n\nMoramor se dise\u00f1\u00f3 para ambos momentos."+HT},
{d:"2026-04-15",pl:"Craft & Detalle Video",f:"Reel",a:5,as:"craftVideo",ph:"Content Push",tp:"5C \u2014 Story behind the bottle",s:0,ig:"Nacida de un instante de amor que cambi\u00f3 todo.\n\nUna noche ordinaria. Un peque\u00f1o bar de tequila.\nY una promesa que se convirti\u00f3 en marca.\n\nMoramor."+HT},
{d:"2026-04-17",pl:"Branding & Dise\u00f1o",f:"Photo Post",a:1,as:"hero",ph:"Content Push",tp:"Quote card \u2014 \"Lo que vale, no se negocia\"",s:1,st:"quote",ig:"Cuatro expresiones.\nUn solo est\u00e1ndar.\n\nPara quienes saben que lo que vale, no se negocia."+HT},
{d:"2026-04-19",pl:"Lifestyle Premium",f:"Threads",a:6,as:null,ph:"Content Push",tp:"6B \u2014 Sell the Night",s:0,ig:"Solo el 12% de consumidores premium identifican correctamente perfiles de sabor en catas a ciegas.\n\nPero el 78% dice que \"la ocasi\u00f3n y el ambiente\" son el factor #1 para elegir marca.\n\nNadie compra especificaciones. Compran la noche que quieren tener.\n\n\u00bfAcuerdo o desacuerdo?"},
{d:"2026-04-22",pl:"Lifestyle Mood Video",f:"Reel",a:3,as:"lifestyleVideo",ph:"Content Push",tp:"3B \u2014 The exclusive moment",s:0,ig:"Lo que est\u00e1 en todos lados se vuelve invisible.\n\nLo que solo est\u00e1 aqu\u00ed se vuelve inolvidable.\n\nMoramor. Para los pocos que saben."+HT},
{d:"2026-04-24",pl:"Branding & Dise\u00f1o",f:"Threads",a:7,as:null,ph:"Content Push",tp:"7A \u2014 The Folklore Trap",s:0,ig:"Envolver tu botella en una bandera no la hace premium. La hace souvenir.\n\nLas que crecen 3x m\u00e1s r\u00e1pido combinan herencia con dise\u00f1o contempor\u00e1neo minimal.\n\n\u00bfTu marca se ve como lujo o como tienda de aeropuerto?"},
{d:"2026-04-26",pl:"Branding & Dise\u00f1o",f:"Carousel",a:4,as:"craft",ph:"Content Push",tp:"Carousel \u2014 Cer\u00e1mica: el material es el mensaje",s:1,st:"carousel",ig:"Cer\u00e1mica.\n\n\ud83d\udccc Artesanal. Cada botella es \u00fanica.\n\ud83d\udccc M\u00e1s peso. M\u00e1s presencia en la mesa.\n\ud83d\udccc Dise\u00f1o talavera \u2014 siglos de tradici\u00f3n mexicana.\n\ud83d\udccc Sin competidor directo en el segmento ultra-premium.\n\ud83d\udccc No es empaque. Es la primera impresi\u00f3n.\n\nMoramor. El material es el mensaje."+HT},
{d:"2026-05-01",pl:"Producto Cinem\u00e1tico",f:"Reel",a:6,as:"cinematico",ph:"Optimization",tp:"6C \u2014 The pour ritual",s:0,ig:"La cer\u00e1mica exige un servicio diferente.\n\nM\u00e1s lento. M\u00e1s presente. M\u00e1s intencional.\n\nEso no es un inconveniente.\nEs el ritual."+HT},
{d:"2026-05-03",pl:"Cultura & Origen",f:"Photo Post",a:7,as:"cultura",ph:"Optimization",tp:"7A \u2014 Heritage, not folklore",s:0,ig:"Herencia sin clich\u00e9.\nOrigen sin disculpa.\n\nLa talavera en Moramor no es adorno.\nEs lenguaje.\n\nRefinado. Minimal. Contempor\u00e1neo."+HT},
{d:"2026-05-06",pl:"Producto Hero",f:"Photo Post",a:3,as:"hero",ph:"Optimization",tp:"3A \u2014 Extra A\u00f1ejo hero",s:0,ig:"Extra A\u00f1ejo.\n\n3+ a\u00f1os en barrica.\nMadera. Chocolate. Camote asado. Vainilla arom\u00e1tica.\n\u00c1mbar oscuro con matices rojizos.\n\nLo extraordinario tarda.\nPero cuando llega, se nota.\n\n750 ml \u00b7 40% Alc. Vol. \u00b7 100% Agave\nCer\u00e1mica talavera artesanal."+HT},
{d:"2026-05-08",pl:"Lifestyle Mood Video",f:"Reel",a:2,as:"lifestyleVideo",ph:"Optimization",tp:"2C \u2014 Made for feed and table",s:0,ig:"Dise\u00f1ada para la mesa.\nOptimizada para el feed.\n\nMoramor."+HT},
{d:"2026-05-10",pl:"Branding & Dise\u00f1o",f:"Photo Post",a:4,as:"craft",ph:"Optimization",tp:"Composici\u00f3n \u2014 S\u00edmbolo + patr\u00f3n talavera",s:1,st:"composici\u00f3n",ig:"Cada s\u00edmbolo tiene una historia.\n\nDos guardianes. Una promesa.\nM\u00e1s amor.\n\nMoramor."+HT},
{d:"2026-05-13",pl:"Branding & Dise\u00f1o",f:"Carousel",a:0,as:"lifestyle",ph:"Optimization",tp:"Carousel editorial \u2014 El momento Moramor",s:1,st:"carousel",ig:"El momento Moramor.\n\n\ud83d\udccc Una mesa bien puesta.\n\ud83d\udccc Una conversaci\u00f3n que importa.\n\ud83d\udccc Una botella que no necesita presentaci\u00f3n.\n\ud83d\udccc Un sabor que no necesita explicaci\u00f3n.\n\ud83d\udccc Una noche que no necesita repetici\u00f3n \u2014 porque no se olvida.\n\nCuatro expresiones. Un solo est\u00e1ndar."+HT},
{d:"2026-05-15",pl:"Branding Animado",f:"Reel",a:0,as:"brandingAnim",ph:"Optimization",tp:"Symbol animation + fade to bottle",s:0,ig:"Cuatro expresiones.\nUn solo est\u00e1ndar.\n\nBlanco \u00b7 Reposado \u00b7 A\u00f1ejo \u00b7 Extra A\u00f1ejo\n\n100% Agave. Cer\u00e1mica talavera artesanal.\nHecho en Jalisco.\n\nEn Moramor no solo hacemos tequila.\nEmbotellamos amor."+HT},
