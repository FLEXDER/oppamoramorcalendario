<style>
:root{--navy:#0D1B6B;--gold:#C8A24E;--bg:#06091F;--card:#0c1235;--card-h:#111a45;--txt:#E8E6E0;--txt2:#8E8C86;--wh:#FFF;--bdr:#111835}

.header{padding:20px 24px 14px;border-bottom:1px solid var(--bdr)}.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.brand{font-size:9px;font-weight:600;letter-spacing:3px;color:var(--gold)}h1{font-size:26px;font-weight:300;color:var(--wh);font-family:'Cormorant Garamond',serif}.subtitle{font-size:11px;color:var(--txt2);margin-top:2px}.phase-label{font-size:11px;color:var(--gold);font-weight:500}.month-display{font-size:20px;font-weight:300;color:var(--wh)}.months{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.sidebar{width:210px;padding:12px 14px 12px 0;flex-shrink:0}.side-box{background:var(--card);border-radius:8px;padding:14px;border:1px solid var(--bdr)}.side-title{font-size:9px;font-weight:600;letter-spacing:2px;margin-bottom:10px}.stat-row{margin-bottom:8px}.stat-head{display:flex;justify-content:space-between;margin-bottom:2px}.stat-label{font-size:9px;color:var(--txt2)}.stat-val{font-size:9px}.bar{height:3px;border-radius:2px;background:var(--bdr);overflow:hidden}.bar-fill{height:100%;border-radius:2px;transition:width .5s}.count{font-size:20px;font-weight:300;color:var(--wh);margin-top:14px;padding-top:10px;border-top:1px solid var(--bdr)}.count span{font-size:10px;color:var(--txt2);margin-left:3px}

.modal-top{padding:24px 24px 0}.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--txt2);cursor:pointer;font-size:20px}.modal-phase{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-bottom:3px}.modal-date{font-size:12px;color:var(--txt2);margin-bottom:14px}.modal-title{font-size:20px;font-weight:400;color:var(--wh);margin-bottom:10px;line-height:1.3;font-family:'Cormorant Garamond',serif}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-family:'Outfit',sans-serif;font-size:10px;font-weight:500}
.modal-body{padding:0 24px 20px}.caption-box{background:#06091F;border-radius:8px;padding:16px;border-left:3px solid var(--gold);margin-bottom:14px}.caption-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.caption-label{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--gold)}
.copy-btn{cursor:pointer;padding:8px 20px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:6px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;transition:all .2s;letter-spacing:1px}.copy-btn:hover{background:var(--gold);color:var(--bg)}.copy-btn.ok{background:#2D8B55;border-color:#2D8B55;color:#fff}
.caption-text{font-size:12.5px;line-height:1.7;color:#d4d2cc;white-space:pre-wrap;word-break:break-word;font-family:'Outfit',sans-serif}
.info-row{display:flex;gap:8px}.info-card{flex:1;background:#06091F;border-radius:6px;padding:10px}.info-label{font-size:9px;font-weight:600;letter-spacing:1px;color:var(--txt2);margin-bottom:3px}.info-val{font-size:11px;color:var(--wh)}.info-dist{font-size:10px;color:var(--txt2);line-height:1.5}
@media(max-width:768px){.main{flex-direction:column}.sidebar{width:100%;padding:0 16px 16px}.cell{min-height:60px}}
</style>

// ═══ ABRIL — FOUNDATION ═══
{d:"2026-04-01",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"Blanco — Hero on navy",ig:"Blanco.\n\nEl agave antes de que el tiempo lo toque.\nFresco. Cristalino. Sin concesiones.\n\nAromas de agave cocido, hierbas frescas, cítricos y fruta.\n\n750 ml · 40% Alc. Vol. · 100% Agave\nCerámica talavera artesanal."+HT},
{d:"2026-04-02",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"Reposado — Hero on navy",ig:"Reposado.\n\nEl tiempo le dio lo que el agave no podía hacer solo.\n\nCaramelo especiado. Frutas tropicales. Vainilla.\nDorado pálido con destellos brillantes.\n\nLa paciencia tiene sabor.\n\n750 ml · 40% Alc. Vol. · 100% Agave\nCerámica talavera artesanal."+HT},
{d:"2026-04-03",pl:"Producto Hero",f:"Photo Post",a:0,as:"hero",ph:"Foundation Grid",tp:"Añejo — Hero on navy",ig:"Añejo.\n\nDe 1 a 3 años en barrica de roble.\nLo que entra joven sale con carácter.\n\nAgave cocido. Almendras tostadas. Clavo. Vainilla.\nÁmbar con matices cobrizos.\n\nHay cosas que solo el tiempo puede crear.\n\n750 ml · 40% Alc. Vol. · 100% Agave\nCerámica talavera artesanal."+HT},
{d:"2026-04-04",pl:"Detalles & Craft",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Close-up talavera detail",ig:"El detalle no es decoración.\nEs declaración.\n\nCada relieve. Cada trazo. Cada imperfección calculada.\n\nCerámica talavera artesanal — una tradición que lleva siglos perfeccionándose.\n\nCuando la sostienes, lo sientes."+HT},
{d:"2026-04-05",pl:"Detalles & Craft",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Macro ceramic texture",ig:"Cerámica. No vidrio.\n\nCada botella pesa más. Cuesta más. Tarda más en producirse.\n\nPero cuando llega a la mesa, nadie pregunta de qué marca es.\n\nPreguntan qué es eso."+HT},
{d:"2026-04-06",pl:"Detalles & Craft",f:"Photo Post",a:0,as:"craft",ph:"Foundation Grid",tp:"Gold accent, dramatic light",ig:"El dorado no susurra.\nConfirma.\n\nLo que se siente diferente, se recuerda diferente."+HT},
{d:"2026-04-07",pl:"Lifestyle Premium",f:"Photo Post",a:0,as:"lifestyle",ph:"Foundation Grid",tp:"Bottle on elegant table",ig:"Algunas noches piden algo diferente.\n\nNo más fuerte. No más caro.\nDiferente.\n\nMoramor no es para todas las noches.\nEs para las que importan."+HT},
{d:"2026-04-08",pl:"Lifestyle Premium",f:"Photo Post",a:0,as:"lifestyle",ph:"Foundation Grid",tp:"Pour moment, warm light",ig:"Cuando la cerámica toca la mesa, algo cambia.\n\nLa conversación se pausa un segundo.\nLas miradas se dirigen al centro.\n\nNo es el tequila.\nEs el momento."+HT},
{d:"2026-04-09",pl:"Cultura & Origen",f:"Photo Post",a:0,as:"cultura",ph:"Foundation Grid",tp:"Bottle with artisanal texture",ig:"Jalisco, México.\n\nDonde el agave azul crece bajo el mismo sol que ha dado forma a generaciones de maestros tequileros.\n\nRaíz mexicana. Lenguaje contemporáneo.\nSin folclor literal. Sin pedir permiso."+HT},

{d:"2026-04-10",pl:"Producto Cinemático",f:"Reel",a:4,as:"cinematico",ph:"Content Push",tp:"360° reveal — Ceramic presence",ig:"750 ml.\nCerámica talavera.\nHecho para quedarse en la mesa.\nY en la memoria."+HT},
{d:"2026-04-11",pl:"Branding & Diseño",f:"Threads",a:7,as:null,ph:"Content Push",tp:"7C — The Price Apology",ig:"Las marcas mexicanas de tequila premium tienen un patrón: se disculpan por su precio.\n\nDescuentan para cerrar. Lideran con \"valor\" en vez de valor.\n\nMientras tanto, las multinacionales ponen precios altos y construyen la marca para justificarlo.\n\nMarcas independientes mexicanas con mejor líquido venden 30-50% más barato que las de conglomerado.\n\nY aún así les dicen \"está caro.\"\n\nEl precio no es un número. Es una declaración.\n\n¿O no?"},

{d:"2026-04-19",pl:"Lifestyle Premium",f:"Threads",a:6,as:null,ph:"Content Push",tp:"6B — Sell the Night",ig:"Solo el 12% de consumidores premium identifican correctamente perfiles de sabor en catas a ciegas.\n\nPero el 78% dice que \"la ocasión y el ambiente\" son el factor #1 para elegir marca.\n\nNadie compra especificaciones. Compran la noche que quieren tener.\n\nSi tu estrategia de contenido para tequila premium es publicar fichas de cata con fondo bonito, estás hablando solo.\n\n¿Acuerdo o desacuerdo?"},
// Week 4
{d:"2026-04-22",pl:"Lifestyle Mood Video",f:"Reel",a:3,as:"lifestyleVideo",ph:"Content Push",tp:"3B — The exclusive moment",ig:"Lo que está en todos lados se vuelve invisible.\n\nLo que solo está aquí se vuelve inolvidable.\n\nMoramor. Para los pocos que saben."+HT},
{d:"2026-04-24",pl:"Branding & Diseño",f:"Threads",a:7,as:null,ph:"Content Push",tp:"7A — The Folklore Trap",ig:"Envolver tu botella en una bandera no la hace premium. La hace souvenir.\n\nMuchas marcas mexicanas confunden autenticidad cultural con estética folklórica.\n\nLas que crecen 3x más rápido en premium combinan herencia cultural con diseño contemporáneo minimal.\n\nHerencia con intención. No folklore con explicación.\n\nFuente: McKinsey Luxury Report, LatAm 2023.\n\n¿Tu marca se ve como lujo o como tienda de aeropuerto?"},
{d:"2026-04-26",pl:"Detalles & Craft",f:"Carousel",a:4,as:"craft",ph:"Content Push",tp:"4B — Material is message (carousel)",ig:"Cerámica.\n\n📌 Artesanal. Cada botella es única.\n📌 Más peso. Más presencia en la mesa.\n📌 Diseño talavera — siglos de tradición mexicana.\n📌 Sin competidor directo en el segmento ultra-premium.\n📌 No es empaque. Es la primera impresión.\n\nMoramor. El material es el mensaje."+HT},

// ═══ MAYO — OPTIMIZATION ═══
{d:"2026-05-01",pl:"Producto Cinemático",f:"Reel",a:6,as:"cinematico",ph:"Optimization",tp:"6C — The pour ritual",ig:"La cerámica exige un servicio diferente.\n\nMás lento. Más presente. Más intencional.\n\nEso no es un inconveniente.\nEs el ritual."+HT},

{d:"2026-05-06",pl:"Producto Hero",f:"Photo Post",a:3,as:"hero",ph:"Optimization",tp:"3A — Extra Añejo hero",ig:"Extra Añejo.\n\n3+ años en barrica.\nMadera. Chocolate. Camote asado. Vainilla aromática.\nÁmbar oscuro con matices rojizos.\n\nLo extraordinario tarda.\nPero cuando llega, se nota.\n\n750 ml · 40% Alc. Vol. · 100% Agave\nCerámica talavera artesanal."+HT},
{d:"2026-05-08",pl:"Lifestyle Mood Video",f:"Reel",a:2,as:"lifestyleVideo",ph:"Optimization",tp:"2C — Made for the feed and the table",ig:"Diseñada para la mesa.\nOptimizada para el feed.\n\nMoramor."+HT},
{d:"2026-05-10",pl:"Detalles & Craft",f:"Photo Post",a:4,as:"craft",ph:"Optimization",tp:"4A — The symbol (macro)",ig:"Cada símbolo tiene una historia.\n\nDos guardianes. Una promesa.\nMás amor.\n\nMoramor."+HT},
{d:"2026-05-13",pl:"Lifestyle Premium",f:"Carousel",a:0,as:"lifestyle",ph:"Optimization",tp:"The Moramor moment (carousel)",ig:"El momento Moramor.\n\n📌 Una mesa bien puesta.\n📌 Una conversación que importa.\n📌 Una botella que no necesita presentación.\n📌 Un sabor que no necesita explicación.\n📌 Una noche que no necesita repetición — porque no se olvida.\n\nCuatro expresiones. Un solo estándar."+HT},
{d:"2026-05-15",pl:"Branding Animado",f:"Reel",a:0,as:"brandingAnim",ph:"Optimization",tp:"Symbol animation + fade to bottle",ig:"Cuatro expresiones.\nUn solo estándar.\n\nBlanco · Reposado · Añejo · Extra Añejo\n\n100% Agave. Cerámica talavera artesanal.\nHecho en Jalisco.\n\nEn Moramor no solo hacemos tequila.\nEmbotellamos amor."+HT},
{d:"2026-05-17",pl:"Cultura & Origen",f:"Photo Post",a:5,as:"cultura",ph:"Optimization",tp:"5C — The origin story",ig:"Un instante de amor que cambió todo.\n\nUna noche ordinaria. Un pequeño bar de tequila en Jalisco. Dos personas. Una revelación:\n\nNinguna marca capturaba ese sentimiento — la elegancia del romance, la intimidad de lo compartido.\n\nDesde esa noche, Moramor.\n\nCon más y más amor.\n— Jacob Amselem, Fundador & CEO"+HT},
{d:"2026-05-20",pl:"Craft & Detalle Video",f:"Reel",a:4,as:"craftVideo",ph:"Optimization",tp:"4C — Light on ceramic (detail reel)",ig:"La luz recorre la cerámica como si buscara algo.\n\nEncuentra lo mismo que tú cuando la sostienes:\n\ncada detalle fue intencional."+HT},
{d:"2026-05-22",pl:"Producto Hero",f:"Photo Post",a:5,as:"hero",ph:"Optimization",tp:"5A — Bottle on pedestal, minimal",ig:"No se trata de cuántas botellas.\nSe trata de cuáles.\n\nMoramor."+HT},
{d:"2026-05-24",pl:"Lifestyle Premium",f:"Threads",a:6,as:null,ph:"Optimization",tp:"6A — Tasting Notes Monologue",ig:"La industria del tequila sigue comunicando como si el consumidor fuera sommelier.\n\nPerfiles organolépticos. Fichas técnicas. Notas de cata.\n\nPero el consumidor premium no compra especificaciones.\nCompra la noche que quiere tener.\n\nEl contenido que convierte habla de momentos, no de moléculas.\n\n¿Tu contenido describe el producto o invita al momento?"},
{d:"2026-05-27",pl:"Producto Hero",f:"Photo Post",a:2,as:"hero",ph:"Optimization",tp:"2B — Dramatic light hero",ig:"Hay botellas que se sirven.\nY hay botellas que se presentan.\n\nMoramor se presenta."+HT},
{d:"2026-05-29",pl:"Lifestyle Mood Video",f:"Reel",a:1,as:"lifestyleVideo",ph:"Optimization",tp:"1B — The pour (nocturnal ambiance)",ig:"La noche correcta.\nLa mesa correcta.\nLa botella correcta.\n\nNo es coincidencia. Es intención."+HT},
{d:"2026-05-31",pl:"Detalles & Craft",f:"Photo Post",a:3,as:"craft",ph:"Optimization",tp:"3B — Abstract product shot",ig:"Lo que se siente diferente, se recuerda diferente.\n\nCerámica talavera. Hecha a mano.\nCada botella, una pieza."+HT},

// ═══ JUNIO — ACCELERATION ═══
{d:"2026-06-03",pl:"Producto Cinemático",f:"Reel",a:5,as:"cinematico",ph:"Acceleration",tp:"5B — Slow motion pour",ig:"Servir Moramor es un acto deliberado.\n\nEl peso de la cerámica. La lentitud del líquido. El silencio antes del primer sorbo.\n\nAlgunos momentos merecen ceremonia."+HT},
{d:"2026-06-05",pl:"Cultura & Origen",f:"Photo Post",a:7,as:"cultura",ph:"Acceleration",tp:"7B — Contemporary Mexican luxury",ig:"México no necesita permiso para definir su propio lujo.\n\nMoramor es esa definición.\n\nRaíz profunda. Expresión contemporánea.\nCerámica talavera. 100% Agave. Jalisco."+HT},
{d:"2026-06-07",pl:"Lifestyle Premium",f:"Photo Post",a:6,as:"lifestyle",ph:"Acceleration",tp:"6B — The night it represents",ig:"La gente no elige tequila.\nElige el tipo de noche que quiere tener.\n\nMoramor es para las noches que se cuentan después."+HT},

let cM="2026-04",cF="All";
function render(){
const mi=MS.find(m=>m.k===cM);
document.getElementById("sub").textContent=`48 fotos + 12 videos · 4 meses · ${P.length} piezas con captions listos`;
document.getElementById("pL").textContent=mi.p;document.getElementById("mD").textContent=mi.l+" 2026";
let mb="";MS.forEach(m=>{mb+=`<button class="mb sans ${m.k===cM?"a":""}" onclick="sM('${m.k}')">${m.l} — ${m.p}</button>`});document.getElementById("mB").innerHTML=mb;
const mp=P.filter(p=>p.d.startsWith(cM));const fc={};mp.forEach(p=>{fc[p.f]=(fc[p.f]||0)+1});
let fb=`<span class="fl sans">FILTER:</span><button class="fb sans ${cF==="All"?"a":""}" onclick="sF('All')">All (${mp.length})</button>`;
Object.entries(FT).forEach(([f,i])=>{if(fc[f])fb+=`<button class="fb sans ${cF===f?"a":""}" onclick="sF('${f}')">${i.i} ${f} (${fc[f]})</button>`});document.getElementById("fB").innerHTML=fb;
let dh="";["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(d=>{dh+=`<div class="dh">${d}</div>`});document.getElementById("dH").innerHTML=dh;
const yr=+cM.split("-")[0],mo=+cM.split("-")[1],dim=new Date(yr,mo,0).getDate(),fdw=new Date(yr,mo-1,1).getDay();
const fl=cF==="All"?mp:mp.filter(p=>p.f===cF);
let g="";for(let i=0;i<fdw;i++)g+=`<div class="cell empty"></div>`;
for(let d=1;d<=dim;d++){const ds=`${cM}-${String(d).padStart(2,"0")}`;const dp=fl.filter(p=>p.d===ds);const hp=dp.length>0?"hp":"";
let pl="";dp.forEach(p=>{const pc=PC[p.pl]||{bg:"#1a1a2d",tx:"#888"};const fi=FT[p.f]||{i:"•",c:"#888"};pl+=`<div class="pill" style="background:${pc.bg};color:${pc.tx};border-left:2px solid ${fi.c}" onclick="event.stopPropagation();oP(${P.indexOf(p)})">${fi.i} ${p.pl.substring(0,14)}</div>`});
const ck=dp.length===1?`onclick="oP(${P.indexOf(dp[0])})"`:""
g+=`<div class="cell ${hp}" ${ck}><div class="cell-day sans">${d}</div>${pl}</div>`}
document.getElementById("cG").innerHTML=g;
const th=P.filter(p=>p.d<=cM+"-31");const u={hero:0,craft:0,lifestyle:0,cultura:0,branding:0,cinematico:0,craftVideo:0,lifestyleVideo:0,brandingAnim:0};
th.forEach(p=>{if(p.as&&u[p.as]!==undefined)u[p.as]++});const t={hero:12,craft:10,lifestyle:12,cultura:8,branding:6,cinematico:4,craftVideo:3,lifestyleVideo:3,brandingAnim:2};
let s=`<div class="side-title" style="color:#C8A24E">FOTOS (ACUM. ${mi.l.toUpperCase()})</div>`;
[{k:"hero",l:"Hero"},{k:"craft",l:"Craft"},{k:"lifestyle",l:"Lifestyle"},{k:"cultura",l:"Cultura"},{k:"branding",l:"Branding"}].forEach(a=>{s+=`<div class="stat-row"><div class="stat-head"><span class="stat-label">${a.l}</span><span class="stat-val" style="color:#C8A24E">${u[a.k]}/${t[a.k]}</span></div><div class="bar"><div class="bar-fill" style="width:${(u[a.k]/t[a.k])*100}%;background:#C8A24E"></div></div></div>`});
s+=`<div class="side-title" style="color:#FF6BAA;margin-top:14px">VIDEOS</div>`;
[{k:"cinematico",l:"Cinemático"},{k:"craftVideo",l:"Craft"},{k:"lifestyleVideo",l:"Lifestyle"},{k:"brandingAnim",l:"Branding"}].forEach(a=>{s+=`<div class="stat-row"><div class="stat-head"><span class="stat-label">${a.l}</span><span class="stat-val" style="color:#FF6BAA">${u[a.k]}/${t[a.k]}</span></div><div class="bar"><div class="bar-fill" style="width:${(u[a.k]/t[a.k])*100}%;background:#FF6BAA"></div></div></div>`});
s+=`<div class="count">${mp.length}<span>posts este mes</span></div>`;document.getElementById("sS").innerHTML=s}
function sM(m){cM=m;cF="All";render()}function sF(f){cF=f;render()}
function oP(i){const p=P[i];const pc=PC[p.pl]||{bg:"#1a1a2d",tx:"#888",bd:"#333"};const fi=FT[p.f]||{i:"•",c:"#888"};
const dt=new Date(p.d+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
let at="";if(p.a>0)at=`<span class="tag" style="background:#0d2228;color:#6BC8DB;border:1px solid #28506a">Angle ${p.a}</span>`;
document.getElementById("md").innerHTML=`<div class="modal-top"><button class="modal-close" onclick="cL()">×</button>
<div class="modal-phase sans">${(p.ph||"").toUpperCase()}</div><div class="modal-date sans">${dt}</div>
<div class="modal-title">${p.tp}</div><div class="tags"><span class="tag" style="background:${pc.bg};color:${pc.tx};border:1px solid ${pc.bd}">${p.pl}</span>
<span class="tag" style="background:#1a1a2d;color:${fi.c};border:1px solid ${fi.c}33">${fi.i} ${p.f}</span>${at}</div></div>
<div class="modal-body"><div class="caption-box"><div class="caption-head"><div class="caption-label sans">CAPTION PARA INSTAGRAM</div>
<button class="copy-btn sans" id="cpB" onclick="cC(${i})">COPIAR</button></div><div class="caption-text">${eH(p.ig)}</div></div>
<div class="info-row">${p.as?`<div class="info-card"><div class="info-label sans">ASSET PÍLDORA</div><div class="info-val sans">${AN[p.as]}</div></div>`:""}<div class="info-card"><div class="info-label sans">DISTRIBUCIÓN</div><div class="info-dist sans">${DIST[p.f]||""}</div></div></div></div>`;
document.getElementById("ov").classList.add("show")}
function cL(){document.getElementById("ov").classList.remove("show")}
document.getElementById("ov").addEventListener("click",function(e){if(e.target===this)cL()});
function cC(i){navigator.clipboard.writeText(P[i].ig).then(()=>{const b=document.getElementById("cpB");b.textContent="✓ COPIADO";b.classList.add("ok");setTimeout(()=>{b.textContent="COPIAR";b.classList.remove("ok")},2000)})}
function eH(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}
render();
</script>
